<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>TravelBuddy - Kinetic Companion Dashboard</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration for Kinetic Companion Theme -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              cream: '#FBF9F4',
              card: '#FFFFFF',
              dark: '#0E0F0C',
              forest: '#163300',
              lime: '#9FE870',
              limeLight: '#EAF9DC',
              muted: '#6B6F66',
              border: '#F0ECE1',
              coral: '#FF6B55',
              coralLight: '#FFE9E4',
              amber: '#FF9F1C',
              amberLight: '#FFF2DD',
              ocean: '#2E86DE',
              oceanLight: '#E5F1FD'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          },
          boxShadow: {
            'soft': '0 8px 30px rgba(22, 51, 0, 0.04)',
            'fab': '0 12px 28px rgba(159, 232, 112, 0.45)'
          },
          borderRadius: {
            '2xl': '24px',
            '3xl': '28px',
            '4xl': '34px'
          }
        }
      }
    };
  </script>
<!-- Custom CSS for Circular Rings & Subtle Accents -->
<style data-purpose="custom-layout">
    /* iOS Safe Area & Native Scrollbar Suppression */
    body {
      -webkit-tap-highlight-color: transparent;
      background-color: #FBF9F4;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-brand-cream text-brand-dark min-h-screen font-sans antialiased flex justify-center selection:bg-brand-lime selection:text-brand-forest">
<!-- Mobile Viewport Wrapper (iOS iPhone 15 Pro Dimensions) -->
<main class="w-full max-w-[430px] min-h-screen pb-32 px-5 pt-4 relative flex flex-col no-scrollbar" data-purpose="mobile-container">
<!-- BEGIN: TopHeader -->
<!-- Top Navigation Header with Brand and Top Micro-Actions -->
<header class="flex items-center justify-between pt-2 pb-5" data-purpose="app-header">
<!-- Brand Logo + Identity -->
<div class="flex items-center space-x-2.5">
<!-- Kinetic Compass Logo -->
<div class="w-9 h-9 rounded-full bg-brand-forest flex items-center justify-center text-brand-lime shadow-sm">
<svg class="w-5 h-5 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.79 12.21l-5.66 2.12 2.12-5.66 5.66-2.12-2.12 5.66zM12 10.9a1.1 1.1 0 100 2.2 1.1 1.1 0 000-2.2z"></path>
</svg>
</div>
<h1 class="text-3xl font-extrabold tracking-tight text-brand-forest">TravelBuddy</h1>
</div>
<!-- Action Pill & Circular Button -->
<div class="flex items-center space-x-2.5">
<!-- Discover/Search Circular Button -->
<button aria-label="Search places" class="w-11 h-11 rounded-full bg-white border border-black/5 shadow-soft flex items-center justify-center text-brand-forest transition-transform active:scale-95">
<svg class="w-5 h-5 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<rect height="18" rx="5" ry="5" width="18" x="3" y="3"></rect>
<circle cx="8.5" cy="8.5" r="1.5"></circle>
<path d="M21 15l-5-5L5 21"></path>
</svg>
</button>
<!-- Travel Streak Badge Pill -->
<div class="flex items-center space-x-1.5 px-3.5 py-2 rounded-full bg-white border border-black/5 shadow-soft">
<svg class="w-4 h-4 text-orange-500 fill-current" viewBox="0 0 20 20">
<path clip-rule="evenodd" d="M12.395 2.553a1 1 0 00-1.45-.385c-.345.23-.614.558-.822.88-.527.82-1.168 2.05-1.723 3.65C7.8 8.33 7.37 9.8 7.02 11.2a4.42 4.42 0 01-.42-1.8 1 1 0 00-1.83-.55 7.03 7.03 0 00-.77 3.65c0 3.86 3.14 7 7 7s7-3.14 7-7c0-2.92-1.78-5.62-3.605-7.95a14.2 14.2 0 00-2-2.047z" fill-rule="evenodd"></path>
</svg>
<span class="text-sm font-bold text-brand-dark tracking-tight">15</span>
</div>
</div>
</header>
<!-- END: TopHeader -->
<!-- BEGIN: TimelineSwitcher -->
<!-- Tab Selector: Upcoming vs Past -->
<nav class="flex items-center space-x-6 pt-1 pb-4" data-purpose="timeline-navigation">
<!-- Active 'Upcoming' Tab -->
<div class="flex flex-col items-center">
<button class="text-[17px] font-bold text-brand-dark tracking-tight focus:outline-none">
          Upcoming
        </button>
<!-- Bright Kinetic Lime Dot Indicator -->
<span class="w-1.5 h-1.5 bg-brand-lime rounded-full mt-1"></span>
</div>
<!-- Inactive 'Past' Tab -->
<button class="text-[17px] font-medium text-brand-muted hover:text-brand-dark transition-colors focus:outline-none pb-2.5">
        Past
      </button>
</nav>
<!-- END: TimelineSwitcher -->
<!-- BEGIN: MainSummaryCard -->
<!-- Primary Big Metric Overview Card -->
<section class="bg-brand-card rounded-3xl p-6 shadow-soft border border-black/5 flex items-center justify-between mb-4.5" data-purpose="primary-hero-metric">
<!-- Left Metric & Label -->
<div class="flex flex-col justify-center">
<div class="flex items-baseline space-x-1">
<span class="text-[52px] font-black text-brand-forest leading-none tracking-tight">42h</span>
</div>
<span class="text-brand-muted text-[15px] font-medium mt-1">Time saved</span>
<!-- Weekly Gain Pill -->
<div class="inline-flex items-center space-x-1 mt-2.5 px-2.5 py-1 bg-brand-limeLight text-brand-forest text-xs font-semibold rounded-full w-max">
<span>+6.5h this week</span>
</div>
</div>
<!-- Right Kinetic Circular Gauge -->
<div class="relative w-28 h-28 flex items-center justify-center">
<svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
<!-- Background Track -->
<circle cx="50" cy="50" fill="transparent" r="40" stroke="#EAF9DC" stroke-width="11"></circle>
<!-- Active Animated Progress Ring (approx 78%) -->
<circle cx="50" cy="50" fill="transparent" r="40" stroke="#9FE870" stroke-dasharray="251.2" stroke-dashoffset="55" stroke-linecap="round" stroke-width="11"></circle>
</svg>
<!-- Centered Core Icon Badge -->
<div class="absolute w-12 h-12 rounded-full bg-brand-forest flex items-center justify-center shadow-inner">
<svg class="w-5 h-5 text-brand-lime fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm4.2 14.2L11 13V7h1.5v5.2l4.5 2.7-.8 1.3z"></path>
</svg>
</div>
</div>
</section>
<!-- END: MainSummaryCard -->
<!-- BEGIN: SecondaryMetricsRow -->
<!-- 3-Column Macro Stat Cards -->
<section class="grid grid-cols-3 gap-3 mb-7" data-purpose="secondary-metrics-grid">
<!-- Card 1: Money Saved -->
<article class="bg-brand-card rounded-2xl p-3.5 pt-4 pb-5 flex flex-col items-center text-center shadow-soft border border-black/5">
<span class="text-lg font-black text-brand-forest tracking-tight">RM 1.8k</span>
<span class="text-xs text-brand-muted font-medium mt-0.5 mb-3.5">Budget saved</span>
<!-- Ring 1 (Coral) -->
<div class="relative w-14 h-14 flex items-center justify-center">
<svg class="w-full h-full transform -rotate-90" viewBox="0 0 48 48">
<circle cx="24" cy="24" fill="transparent" r="19" stroke="#FFE9E4" stroke-width="5.5"></circle>
<circle cx="24" cy="24" fill="transparent" r="19" stroke="#FF6B55" stroke-dasharray="119.3" stroke-dashoffset="35" stroke-linecap="round" stroke-width="5.5"></circle>
</svg>
<div class="absolute w-7 h-7 rounded-full bg-brand-coralLight flex items-center justify-center">
<svg class="w-3.5 h-3.5 text-brand-coral fill-current" viewBox="0 0 20 20">
<path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z"></path>
<path clip-rule="evenodd" d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 13a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zm5-1a1 1 0 100 2h1a1 1 0 100-2H9z" fill-rule="evenodd"></path>
</svg>
</div>
</div>
</article>
<!-- Card 2: Places Visited -->
<article class="bg-brand-card rounded-2xl p-3.5 pt-4 pb-5 flex flex-col items-center text-center shadow-soft border border-black/5">
<span class="text-lg font-black text-brand-forest tracking-tight">14</span>
<span class="text-xs text-brand-muted font-medium mt-0.5 mb-3.5">Places pinned</span>
<!-- Ring 2 (Amber) -->
<div class="relative w-14 h-14 flex items-center justify-center">
<svg class="w-full h-full transform -rotate-90" viewBox="0 0 48 48">
<circle cx="24" cy="24" fill="transparent" r="19" stroke="#FFF2DD" stroke-width="5.5"></circle>
<circle cx="24" cy="24" fill="transparent" r="19" stroke="#FF9F1C" stroke-dasharray="119.3" stroke-dashoffset="45" stroke-linecap="round" stroke-width="5.5"></circle>
</svg>
<div class="absolute w-7 h-7 rounded-full bg-brand-amberLight flex items-center justify-center">
<svg class="w-3.5 h-3.5 text-brand-amber fill-current" viewBox="0 0 20 20">
<path clip-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" fill-rule="evenodd"></path>
</svg>
</div>
</div>
</article>
<!-- Card 3: Plan Accuracy -->
<article class="bg-brand-card rounded-2xl p-3.5 pt-4 pb-5 flex flex-col items-center text-center shadow-soft border border-black/5">
<span class="text-lg font-black text-brand-forest tracking-tight">96%</span>
<span class="text-xs text-brand-muted font-medium mt-0.5 mb-3.5">Plan accuracy</span>
<!-- Ring 3 (Ocean Blue) -->
<div class="relative w-14 h-14 flex items-center justify-center">
<svg class="w-full h-full transform -rotate-90" viewBox="0 0 48 48">
<circle cx="24" cy="24" fill="transparent" r="19" stroke="#E5F1FD" stroke-width="5.5"></circle>
<circle cx="24" cy="24" fill="transparent" r="19" stroke="#2E86DE" stroke-dasharray="119.3" stroke-dashoffset="15" stroke-linecap="round" stroke-width="5.5"></circle>
</svg>
<div class="absolute w-7 h-7 rounded-full bg-brand-oceanLight flex items-center justify-center">
<svg class="w-3.5 h-3.5 text-brand-ocean fill-current" viewBox="0 0 20 20">
<path clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill-rule="evenodd"></path>
</svg>
</div>
</div>
</article>
</section>
<!-- END: SecondaryMetricsRow -->
<!-- BEGIN: RecentTripsSection -->
<section class="flex flex-col space-y-3.5" data-purpose="recent-trips-list">
<!-- Section Heading -->
<div class="flex items-center justify-between pb-1">
<h2 class="text-2xl font-black tracking-tight text-brand-forest">Recent Trips</h2>
</div>
<!-- Trip Card 1: Penang -->
<article class="bg-brand-card rounded-3xl p-3.5 shadow-soft border border-black/5 flex items-center space-x-3.5">
<!-- Destination Visual -->
<div class="w-28 h-28 rounded-2xl overflow-hidden flex-shrink-0 bg-neutral-200">
<img alt="Penang Street Heritage" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDKw475tHkL7l-w8Q22z-42tEXHSwni9b4TNs9tcutCdw8q4pO62EU762ZyHpB5mqhEmYxq5gyfJRt2pmkblstyh8N1Pm1X9lXqUzRk_SdVlETVIf50ecoutTdu02c47QziXvvw1sK80tl5iiEow-3KstWhOyi_R6tPI3mNhYoujz8IbowNb2g2ujlN1m1wwaU3wwPVnvDwrQn9yPNfefalpAcE7IbP5i2ncmydEt1XZ73TfpLrpeVW">
</div>
<!-- Trip Details -->
<div class="flex-1 min-w-0 pr-1">
<!-- Top Row: Title & Status Badge -->
<div class="flex items-center justify-between gap-1 mb-1">
<h3 class="text-[17px] font-bold text-brand-dark truncate tracking-tight">Penang Heritage &amp;...</h3>
<span class="text-[11px] font-semibold text-brand-forest bg-[#F4F4EE] px-2.5 py-0.5 rounded-full flex-shrink-0">
              9:00am
            </span>
</div>
<!-- Middle Row: Duration / Budget Indicator -->
<div class="flex items-center space-x-1.5 my-1.5 text-brand-forest font-semibold text-[13px]">
<!-- Spark / Compass Icon -->
<svg class="w-3.5 h-3.5 fill-current text-brand-forest" viewBox="0 0 20 20">
<path clip-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" fill-rule="evenodd"></path>
</svg>
<span>7 Days Trip</span>
</div>
<!-- Bottom Row: 3 Macro Chips (Stops, Pax, Type) -->
<div class="flex items-center space-x-3 text-xs text-brand-muted font-medium pt-1">
<!-- Stat 1 -->
<div class="flex items-center space-x-1">
<span class="w-2 h-2 rounded-full bg-brand-coral"></span>
<span class="text-brand-dark font-semibold">14</span>
<span>stops</span>
</div>
<!-- Stat 2 -->
<div class="flex items-center space-x-1">
<span class="w-2 h-2 rounded-full bg-brand-amber"></span>
<span class="text-brand-dark font-semibold">2</span>
<span>pax</span>
</div>
<!-- Stat 3 -->
<div class="flex items-center space-x-1">
<span class="w-2 h-2 rounded-full bg-brand-ocean"></span>
<span class="text-brand-dark font-semibold">Work</span>
</div>
</div>
</div>
</article>
<!-- Trip Card 2: Tokyo -->
<article class="bg-brand-card rounded-3xl p-3.5 shadow-soft border border-black/5 flex items-center space-x-3.5">
<!-- Destination Visual -->
<div class="w-28 h-28 rounded-2xl overflow-hidden flex-shrink-0 bg-neutral-200">
<img alt="Tokyo Autumn Street" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAIATePhMtj3IT6r3rRlRwLPHjbnFcPTz2HgRtGLnbWcuAQ5RDZ4ugryPpwIlLzTF7tbeotLvN2SDcWeVURGxfUjRKeJ-VvY38uc7Zrv0Lsa6Q7D-n4y4tIuKEXa02UPDZpLWb7IFeqago2anvChrU0cUiQI2gu23X9hUNVFZsVHZN75pub-ywufiDbCb6ICHsWXVQlcRrnYJzkikqsGaQyK9usHdFxvL4mzpnxWPpFb4-RRu_IxUMd">
</div>
<!-- Trip Details -->
<div class="flex-1 min-w-0 pr-1">
<!-- Top Row: Title & Status Badge -->
<div class="flex items-center justify-between gap-1 mb-1">
<h3 class="text-[17px] font-bold text-brand-dark truncate tracking-tight">Tokyo Autumn Sprints...</h3>
<span class="text-[11px] font-semibold text-brand-forest bg-[#F4F4EE] px-2.5 py-0.5 rounded-full flex-shrink-0">
              Oct 24
            </span>
</div>
<!-- Middle Row: Duration / Budget Indicator -->
<div class="flex items-center space-x-1.5 my-1.5 text-brand-forest font-semibold text-[13px]">
<svg class="w-3.5 h-3.5 fill-current text-brand-forest" viewBox="0 0 20 20">
<path clip-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" fill-rule="evenodd"></path>
</svg>
<span>10 Days Trip</span>
</div>
<!-- Bottom Row: 3 Macro Chips -->
<div class="flex items-center space-x-3 text-xs text-brand-muted font-medium pt-1">
<!-- Stat 1 -->
<div class="flex items-center space-x-1">
<span class="w-2 h-2 rounded-full bg-brand-coral"></span>
<span class="text-brand-dark font-semibold">22</span>
<span>stops</span>
</div>
<!-- Stat 2 -->
<div class="flex items-center space-x-1">
<span class="w-2 h-2 rounded-full bg-brand-amber"></span>
<span class="text-brand-dark font-semibold">Solo</span>
</div>
<!-- Stat 3 -->
<div class="flex items-center space-x-1">
<span class="w-2 h-2 rounded-full bg-brand-ocean"></span>
<span class="text-brand-dark font-semibold">Active</span>
</div>
</div>
</div>
</article>
</section>
<!-- END: RecentTripsSection -->
<!-- BEGIN: BottomNavigationAndFAB -->
<!-- Fixed Bottom Bar Wrapper bounded to 430px -->
<div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] z-50 pointer-events-none px-4 pb-6">
<!-- Nav Bar Container -->
<footer class="pointer-events-auto bg-white/95 backdrop-blur-md rounded-full shadow-lg border border-black/5 px-6 py-3 flex items-center justify-between relative" data-purpose="bottom-navigation-bar">
<!-- Left Side: 3 Navigation Items occupying ~72% of bar -->
<div class="flex items-center justify-between w-[72%] pr-2">
<!-- Tab 1: Home (Active) -->
<button class="flex flex-col items-center group focus:outline-none">
<svg class="w-6 h-6 stroke-brand-forest" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" viewBox="0 0 24 24">
<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
<polyline points="9 22 9 12 15 12 15 22"></polyline>
</svg>
<span class="text-[11px] font-bold text-brand-forest mt-0.5">Home</span>
</button>
<!-- Tab 2: Analytics / Plans -->
<button class="flex flex-col items-center group focus:outline-none">
<svg class="w-6 h-6 stroke-brand-muted group-hover:stroke-brand-dark transition-colors" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.1" viewBox="0 0 24 24">
<line x1="18" x2="18" y1="20" y2="10"></line>
<line x1="12" x2="12" y1="20" y2="4"></line>
<line x1="6" x2="6" y1="20" y2="14"></line>
</svg>
<span class="text-[11px] font-medium text-brand-muted group-hover:text-brand-dark transition-colors mt-0.5">Analytics</span>
</button>
<!-- Tab 3: Settings -->
<button class="flex flex-col items-center group focus:outline-none">
<svg class="w-6 h-6 stroke-brand-muted group-hover:stroke-brand-dark transition-colors" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.1" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="3"></circle>
<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
</svg>
<span class="text-[11px] font-medium text-brand-muted group-hover:text-brand-dark transition-colors mt-0.5">Settings</span>
</button>
</div>
<!-- Right Side: Floating Kinetic Lime Action Button (+) Overlap -->
<div class="absolute -right-2 -top-6">
<button aria-label="Add new itinerary or scan trip" class="w-[72px] h-[72px] rounded-full bg-brand-lime flex items-center justify-center shadow-fab text-brand-forest transition-transform active:scale-90 hover:scale-105">
<svg class="w-8 h-8 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewBox="0 0 24 24">
<line x1="12" x2="12" y1="5" y2="19"></line>
<line x1="5" x2="19" y1="12" y2="12"></line>
</svg>
</button>
</div>
</footer>
</div>
<!-- END: BottomNavigationAndFAB -->
</main>
</body></html>
